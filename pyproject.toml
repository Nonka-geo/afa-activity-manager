[project]
name = "afa-activity-manager"
version = "0.1.0"
description = "AFA extracurricular activity viability manager"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<6.0",
    "pytest>=8.0,<9.0",
    "pytest-django>=4.9,<5.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "*_test.py"]
testpaths = ["tests"]
